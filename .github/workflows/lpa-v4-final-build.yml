name: Livres Para Adorar v4 Final Test Build

on:
  push:
    branches: [livres-para-adorar-v4-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: lpa_v4_android
        run: gradle assembleDebug --stacktrace
      - name: Copy artifact
        run: cp lpa_v4_android/app/build/outputs/apk/debug/app-debug.apk Livres_Para_Adorar_v4_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Livres-Para-Adorar-v4-Android-Test
          path: Livres_Para_Adorar_v4_Android.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copy web app
        shell: pwsh
        run: Copy-Item "lpa_v4_android/app/src/main/assets/index.html" "lpa_v4_desktop/index.html" -Force
      - name: Install dependencies
        working-directory: lpa_v4_desktop
        run: npm install
      - name: Build EXE
        working-directory: lpa_v4_desktop
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Livres-Para-Adorar-v4-Windows-Test
          path: lpa_v4_desktop/dist/Livres_Para_Adorar_v4_Windows.exe
          if-no-files-found: error
