name: Build Livres para Adorar v4

on:
  push:
    branches:
      - livres-para-adorar-v4-build
    paths:
      - 'lpa_v4_android/**'
      - 'lpa_v4_desktop/**'
      - '.github/workflows/livres-para-adorar-v4-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lpa_v4_android/**'
      - 'lpa_v4_desktop/**'
      - '.github/workflows/livres-para-adorar-v4-build.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare embedded web app
        run: |
          mkdir -p lpa_v4_android/app/src/main/assets
          base64 -d lpa_v4_android/app_source/index.html.gz.b64 | gzip -d > lpa_v4_android/app/src/main/assets/index.html
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: lpa_v4_android
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp lpa_v4_android/app/build/outputs/apk/debug/app-debug.apk Livres_Para_Adorar_v4_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Livres-Para-Adorar-v4-Android
          path: Livres_Para_Adorar_v4_Android.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare embedded web app
        shell: pwsh
        run: |
          node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync('lpa_v4_desktop/index.html',z.gunzipSync(Buffer.from(fs.readFileSync('lpa_v4_android/app_source/index.html.gz.b64','utf8').trim(),'base64')))"
      - name: Install desktop dependencies
        working-directory: lpa_v4_desktop
        run: npm install
      - name: Build Windows EXE
        working-directory: lpa_v4_desktop
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Livres-Para-Adorar-v4-Windows
          path: lpa_v4_desktop/dist/Livres_Para_Adorar_v4_Windows.exe
          if-no-files-found: error
