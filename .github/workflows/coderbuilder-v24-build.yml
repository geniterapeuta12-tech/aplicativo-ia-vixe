name: CoderBuilder 2.5 Build

on:
  push:
    branches: [coderbuilder-v2.5-alpha]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: html-builder/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoderBuilder_2.5.0-alpha.1_Android
          path: html-builder/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: html-builder/desktop-v3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy shared interface
        shell: pwsh
        run: Copy-Item ../android/app/src/main/assets/coderbuilder.html ./index.html
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python make_icon.py
      - name: Install dependencies
        run: npm install
      - name: Build Windows EXE
        run: npm run build:win
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CoderBuilder_2.5.0-alpha.1_Windows
          path: html-builder/desktop-v3/dist/*.exe
          if-no-files-found: error
