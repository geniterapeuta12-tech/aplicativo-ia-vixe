name: Build Livres para Adorar Android Fixed

on:
  pull_request:
    branches: [main]
  push:
    branches: [livres-para-adorar-v4-build]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare app asset
        run: |
          mkdir -p lpa_v4_android/app/src/main/assets
          base64 -d lpa_v4_android/app_source/index.html.gz.b64 | gzip -d > lpa_v4_android/app/src/main/assets/index.html
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: lpa_v4_android
        run: gradle assembleDebug --stacktrace
      - run: cp lpa_v4_android/app/build/outputs/apk/debug/app-debug.apk Livres_Para_Adorar_v4_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Livres-Para-Adorar-v4-Android-Fixed
          path: Livres_Para_Adorar_v4_Android.apk
          if-no-files-found: error
