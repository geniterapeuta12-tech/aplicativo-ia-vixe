kground:transparent;color:#8fa5c0;border-radius:12px;display:grid;place-items:center;gap:2px;font-size:10px}.navbtn .ico{width:20px;height:20px}.navbtn.active{color:#58b9ff;background:#0b203a}.backdrop{position:fixed;inset:0;z-index:80;background:#02060dbb;display:none}.backdrop.open{display:block}.sheet{position:absolute;left:10px;right:10px;bottom:10px;max-height:88vh;border:1px solid #31577f;border-radius:22px;background:linear-gradient(180deg,#0d2037,#071321);box-shadow:0 28px 90px #000c;overflow:hidden;display:grid;grid-template-rows:auto 1fr}.sheet.center{left:18px;right:18px;bottom:auto;top:50%;transform:translateY(-50%);max-height:82vh}.sheet-head{height:60px;display:flex;align-items:center;gap:10px;padding:0 15px;border-bottom:1px solid #203d5e;background:#091829}.sheet-head h2{margin:0;font-size:18px;flex:1}.sheet-body{overflow:auto;padding:14px}.menu-list{display:grid;gap:7px}.menu-item{width:100%;border:1px solid transparent;border-radius:14px;background:transparent;color:#eaf4ff;padding:12px;display:grid;grid-template-columns:42px 1fr 18px;align-items:center;gap:10px;text-align:left}.menu-item:hover,.menu-item:active{background:#112845;border-color:#294e77}.menu-icon{width:40px;height:40px;border-radius:12px;background:#0c1c31;border:1px solid #294f79;color:#4cb8ff;display:grid;place-items:center}.menu-copy b{display:block;font-size:14px}.menu-copy small{display:block;color:#8ea6c3;margin-top:2px}.chev{color:#6f88a8}.section{color:#64bfff;font-size:11px;font-weight:800;letter-spacing:.08em;margin:10px 2px 8px}.project-row,.version-row,.export-row,.list-row{border:1px solid #23466f;border-radius:14px;background:#0b1b2e;padding:12px;margin-bottom:9px}.row-top{display:flex;gap:8px;align-items:flex-start}.row-top .menu-icon{width:38px;height:38px;flex:0 0 38px}.row-main{flex:1;min-width:0}.row-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:#8fa6c2;margin-top:4px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{border:1px solid #28517b;border-radius:999px;padding:3px 7px;color:#77c6ff;font-size:10px}.row-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.rowbtn{height:35px;border:1px solid #2a4e78;border-radius:9px;background:#0a1728;color:#dbeaff;padding:0 10px}.rowbtn.primary{border-color:#1479ff;color:#66c0ff;background:#0c2038}.tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}.tabbtn{height:36px;border:1px solid #294c73;border-radius:10px;background:#0a1728;color:#a9bdd6;padding:0 12px;white-space:nowrap}.tabbtn.active{border-color:#1479ff;color:#66c0ff;background:#0c2038}.setting{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #1b3553}.setting:last-child{border-bottom:0}.setting b{display:block}.setting small{display:block;color:#8fa5bf;margin-top:3px;max-width:260px}.switch{appearance:none;width:46px;height:26px;border-radius:999px;background:#263c55;border:1px solid #365a82;position:relative;outline:none}.switch:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#b8c7d9;transition:.2s}.switch:checked{background:#1269f5;border-color:#2a95ff}.switch:checked:before{left:23px;background:white}.range{width:145px}.inputbox{margin-top:8px}.dialog-actions{display:flex;gap:8px;margin-top:14px}.dialog-actions .btn{flex:1}.empty{text-align:center;color:#8096b4;padding:34px 10px}.toolbar-pop{position:fixed;z-index:70;right:16px;top:142px;width:285px;border:1px solid #31577e;border-radius:16px;background:#081827;padding:10px;box-shadow:0 22px 70px #000c;display:none}.toolbar-pop.open{display:block}.zoomrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.tool{height:42px;border:1px solid #294e77;border-radius:11px;background:#0c1c30;color:#e7f3ff;display:flex;align-items:center;justify-content:center;gap:6px}.tool.active{border-color:#178bff;color:#66c4ff;background:#102b49}.toolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}.fullscreen{position:fixed;inset:0;z-index:100;background:#050d18;display:none;grid-template-rows:58px 1fr}.fullscreen.open{display:grid}.fullbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#061321;border-bottom:1px solid #23415f}.fulltitle{flex:1;font-weight:700}.fullstage{display:grid;place-items:center;padding:10px;overflow:auto}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(18px);background:#102944;border:1px solid #3673ad;color:#ecf6ff;border-radius:11px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s;z-index:120}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:760px){main{display:grid;grid-template-columns:330px 1fr;gap:13px}.card{margin-bottom:0}.editor-card{grid-row:span 2}.preview-card{grid-column:1/-1}.bottomnav{display:none}body{padding-bottom:0}.appbar{position:sticky}.sheet{left:50%;right:auto;width:min(620px,92vw);transform:translateX(-50%)}.sheet.center{left:50%;right:auto;transform:translate(-50%,-50%);width:min(560px,92vw)}}

<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const now=()=>Date.now();const stamp=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});const icon=n=>`<svg class="ico"><use href="#i-${n}"/></svg>`;
const DEFAULT_HTML=`<!doctype html>\n<html lang="pt-BR">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <title>Meu Site</title>\n  <style>\n    body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0d1117,#1a1f2e);color:white;min-height:100vh;display:grid;place-items:center}\n    .box{text-align:center;padding:36px}\n    h1{font-size:42px;margin:0 0 12px}\n    p{color:#c8d2e1}\n    button{padding:12px 20px;border:0;border-radius:10px;background:#1479ff;color:white;font-weight:bold}\n  </style>\n</head>\n<body>\n  <div class="box">\n    <h1>Meu Site</h1>\n    <p>Bem-vindo ao meu site criado com CoderBuilder!</p>\n    <button>Vamos codar! 🚀</button>\n  </div>\n</body>\n</html>`;
const EMPTY_HTML=`<!doctype html>\n<html lang="pt-BR">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <title>Novo projeto</title>\n</head>\n<body>\n\n</body>\n</html>`;
const STORE='coderbuilder_v23';let db;let autosaveTimer,previewTimer;let sheetStack=[];let activeFilter='all';
function fresh(){return{version:23,currentId:null,lists:[{id:'geral',name:'Geral'},{id:'sites',name:'Sites'},{id:'estudos',name:'Estudos'},{id:'templates',name:'Templates'}],projects:[],exports:[],settings:{autosave:true,autoPreview:true,wrap:false,versions:true,fontSize:13,previewZoom:100,previewDevice:'auto'}}}
function load(){try{db=JSON.parse(localStorage.getItem(STORE))||fresh()}catch(e){db=fresh()}if(!Array.isArray(db.lists)||!db.lists.length)db.lists=fresh().lists;if(!db.settings)db.settings=fresh().settings;db.settings={...fresh().settings,...db.settings};persist()}
function persist(){localStorage.setItem(STORE,JSON.stringify(db))}
function current(){return db.projects.find(p=>p.id===db.currentId)||null}
function normalizedName(){let n=$('fileName').value.trim()||'pagina.html';if(!/\.html?$/i.test(n))n+='.html';return n.replace(/[<>:"/\\|?*]/g,'_')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1800)}
function createVersion(p,reason,force=false){if(!db.settings.versions&&!force)return;p.versions=p.versions||[];const html=p.html||$('code').value;if(!force&&p.versions[0]?.html===html)return;p.versions.unshift({id:uid(),name:p.name,listId:p.listId,html,ts:now(),reason});p.versions=p.versions.slice(0,20)}
function saveProject(manual=false){let p=current();if(!p){p={id:uid(),name:normalizedName(),html:$('code').value,listId:$('listSelect').value||'geral',updatedAt:now(),versions:[],archived:false};db.projects.unshift(p);db.currentId=p.id;createVersion(p,'Projeto criado',true)}const old=p.html;p.name=normalizedName();p.html=$('code').value;p.listId=$('listSelect').value||'geral';p.updatedAt=now();if(db.settings.versions&&(manual||old!==p.html)){const last=p.versions?.[0]?.ts||0;if(manual||now()-last>300000)createVersion(p,manual?'Salvamento manual':'Versão automática')}persist();$('saveState').textContent=db.settings.autosave?'Rascunho salvo':'Salvamento automático desligado';if(manual)toast('Projeto salvo')}
function scheduleSave(){if(!db.settings.autosave)return;clearTimeout(autosaveTimer);$('saveState').textContent='Salvando rascunho…';autosaveTimer=setTimeout(()=>saveProject(false),700)}
function schedulePreview(){if(!db.settings.autoPreview)return;clearTimeout(previewTimer);previewTimer=setTimeout(updatePreview,250)}
function updatePreview(){const html=$('code').value;$('preview').srcdoc=html;if($('fullscreen').classList.contains('open'))$('fullPreview').srcdoc=html;updatePreviewLabel()}
function updateLineCount(){$('lineCount').textContent=$('code').value.split('\n').length+' linhas'}
function renderLists(){const s=$('listSelect'),old=s.value||current()?.listId||'geral';s.innerHTML='';db.lists.forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.name;s.appendChild(o)});s.value=db.lists.some(l=>l.id===old)?old:'geral'}
function loadProject(id){const p=db.projects.find(x=>x.id===id);if(!p)return;db.currentId=id;$('fileName').value=p.name;$('code').value=p.html;renderLists();$('listSelect').value=p.listId||'geral';persist();updateLineCount();updatePreview();closeSheet();window.scrollTo({top:0,behavior:'smooth'});toast('Projeto aberto')}
function newProject(){saveProject(false);db.currentId=null;$('fileName').value='novo_projeto.html';$('code').value=EMPTY_HTML;renderLists();$('listSelect').value='geral';persist();updateLineCount();updatePreview();closeSheet();toast('Novo projeto')}
function listName(id){return db.lists.find(l=>l.id===id)?.name||'Geral'}
function exportHtml(openAfter=false){saveProject(false);db.exports.unshift({id:uid(),name:normalizedName(),ts:now()});db.exports=db.exports.slice(0,60);persist();const html=$('code').value,name=normalizedName();if(window.CoderBuilderNative?.exportHtml){window.CoderBuilderNative.exportHtml(name,html,openAfter);return}if(window.coderBuilder?.saveHtml){(openAfter?window.coderBuilder.openHtml(name,html):window.coderBuilder.saveHtml(name,html));toast(openAfter?'Abrindo no navegador…':'HTML exportado');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);if(openAfter)window.open(a.href,'_blank')}
function openSheet(title,html,center=false,push=true){if(push&&$('backdrop').classList.contains('open'))sheetStack.push({title:$('sheetTitle').textContent,html:$('sheetBody').innerHTML,center:$('sheet').classList.contains('center')});$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('sheet').classList.toggle('center',center);$('backdrop').classList.add('open')}
function closeSheet(){sheetStack=[];$('backdrop').classList.remove('open')}
function sheetBack(){if(!sheetStack.length){closeSheet();return}const x=sheetStack.pop();$('sheetTitle').textContent=x.title;$('sheetBody').innerHTML=x.html;$('sheet').classList.toggle('center',x.center);bindRestoredSheet()}
function bindRestoredSheet(){if($('projectSearch'))bindProjects();if($('settingsForm'))bindSettings()}
function mainMenu(){openSheet('CoderBuilder',`<div class="menu-list"><button class="menu-item" data-open="projects"><span class="menu-icon">${icon('folder')}</span><span class="menu-copy"><b>Projetos e listas</b><small>Organize e continue seus projetos</small></span><span class="chev">›</span></button><button class="menu-item" data-open="exports"><span class="menu-icon">${icon('download')}</span><span class="menu-copy"><b>Baixados / Exportados</b><small>Veja o histórico de HTMLs</small></span><span class="chev">›</span></button><button class="menu-item" data-open="settings"><span class="menu-icon">${icon('settings')}</span><span class="menu-copy"><b>Configurações</b><small>Personalize editor, prévia e versões</small></span><span class="chev">›</span></button><button class="menu-item" data-open="new"><span class="menu-icon">${icon('plus')}</span><span class="menu-copy"><b>Novo projeto</b><small>Comece um HTML em branco</small></span><span class="chev">›</span></button><button class="menu-item" data-open="about"><span class="menu-icon">${icon('info')}</span><span class="menu-copy"><b>Sobre o CoderBuilder</b><small>Versão 2.3.0-alpha.1</small></span><span class="chev">›</span></button></div>`);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const a=b.dataset.open;if(a==='projects')openProjects();if(a==='exports')openExports();if(a==='settings')openSettings();if(a==='new')newProject();if(a==='about')openAbout()})}
function openProjects(filter=activeFilter){activeFilter=filter;const active=db.projects.filter(p=>!p.archived),archived=db.projects.filter(p=>p.archived);openSheet('Projetos e listas',`<div class="tabs"><button class="tabbtn ${filter==='all'?'active':''}" data-filter="all">Todos ${active.length}</button>${db.lists.map(l=>`<button class="tabbtn ${filter===l.id?'active':''}" data-filter="${l.id}">${esc(l.name)} ${active.filter(p=>p.listId===l.id).length}</button>`).join('')}<button class="tabbtn ${filter==='archived'?'active':''}" data-filter="archived">Arquivados ${archived.length}</button></div><div class="actions"><button class="btn" id="newListBtn">${icon('plus')} Nova lista</button><button class="btn" id="newProjectHere">${icon('plus')} Novo projeto</button></div><div class="inputbox"><input id="projectSearch" class="input" placeholder="Buscar projetos…"></div><div id="projectRows"></div>`);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>openProjects(b.dataset.filter));$('newListBtn').onclick=()=>askInput('Nova lista','', 'Ex.: Clientes',createList);$('newProjectHere').onclick=newProject;bindProjects()}
function bindProjects(){const input=$('projectSearch');if(!input)return;const render=()=>{const q=input.value.toLowerCase();let data=db.projects.filter(p=>activeFilter==='archived'?p.archived:!p.archived&&(activeFilter==='all'||p.listId===activeFilter));data=data.filter(p=>p.name.toLowerCase().includes(q));$('projectRows').innerHTML=data.length?data.map(p=>projectHtml(p)).join(''):'<div class="empty">Nenhum projeto aqui.</div>';document.querySelectorAll('[data-proj-open]').forEach(b=>b.onclick=()=>loadProject(b.dataset.projOpen));document.querySelectorAll('[data-proj-ver]').forEach(b=>b.onclick=()=>openVersions(b.dataset.projVer));document.querySelectorAll('[data-proj-more]').forEach(b=>b.onclick=()=>openProjectActions(b.dataset.projMore))};input.oninput=render;render()}
function projectHtml(p){return `<div class="project-row"><div class="row-top"><span class="menu-icon">${icon('code')}</span><div class="row-main"><b>${esc(p.name)}</b><div class="meta">${esc(listName(p.listId))} · ${stamp(p.updatedAt)}</div><div class="tags"><span class="tag">${p.versions?.length||0} versões</span>${p.archived?'<span class="tag">Arquivado</span>':''}</div></div></div><div class="row-actions"><button class="rowbtn primary" data-proj-open="${p.id}">Abrir</button><button class="rowbtn" data-proj-ver="${p.id}">Versões</button><button class="rowbtn" data-proj-more="${p.id}">Mais</button></div></div>`}
function openProjectActions(id){const p=db.projects.find(x=>x.id===id);if(!p)return;openSheet(p.name,`<div class="menu-list"><button class="menu-item" id="renameP"><span class="menu-icon">${icon('edit')}</span><span class="menu-copy"><b>Renomear projeto</b><small>Altere somente o nome do arquivo</small></span><span class="chev">›</span></button><button class="menu-item" id="duplicateP"><span class="menu-icon">${icon('copy')}</span><span class="menu-copy"><b>Duplicar projeto</b><small>Cria uma cópia independente</small></span><span class="chev">›</span></button><button class="menu-item" id="moveP"><span class="menu-icon">${icon('list')}</span><span class="menu-copy"><b>Mover para lista</b><small>Organize sem perder conteúdo</small></span><span class="chev">›</span></button><button class="menu-item" id="versionsP"><span class="menu-icon">${icon('history')}</span><span class="menu-copy"><b>Histórico de versões</b><small>Visualize ou restaure versões</small></span><span class="chev">›</span></button><button class="menu-item" id="archiveP"><span class="menu-icon">${icon('archive')}</span><span class="menu-copy"><b>${p.archived?'Restaurar dos arquivados':'Arquivar projeto'}</b><small>${p.archived?'Volta para seus projetos ativos':'Sai da lista principal sem ser excluído'}</small></span><span class="chev">›</span></button></div><div class="project-row" style="margin-top:12px"><div class="meta">Projetos não são excluídos pelo CoderBuilder 2.3. Arquive para esconder sem perder o trabalho.</div></div>`);$('renameP').onclick=()=>askInput('Renomear projeto',p.name,'nome.html',v=>renameProject(p.id,v));$('duplicateP').onclick=()=>duplicateProject(p.id);$('moveP').onclick=()=>chooseList(p.id);$('versionsP').onclick=()=>openVersions(p.id);$('archiveP').onclick=()=>{p.archived=!p.archived;p.updatedAt=now();persist();toast(p.archived?'Projeto arquivado':'Projeto restaurado');openProjects(p.archived?'archived':'all')}}
function renameProject(id,value){const p=db.projects.find(x=>x.id===id);if(!p)return;let n=value.trim();if(!n)return;if(!/\.html?$/i.test(n))n+='.html';createVersion(p,'Antes de renomear',true);p.name=n;p.updatedAt=now();if(db.currentId===id)$('fileName').value=n;persist();openProjects(activeFilter);toast('Projeto renomeado')}
function duplicateProject(id){const p=db.projects.find(x=>x.id===id);if(!p)return;const c=JSON.parse(JSON.stringify(p));c.id=uid();c.name=p.name.replace(/(\.html?)$/i,' - copia$1');c.updatedAt=now();c.archived=false;c.versions=[];createVersion(c,'Projeto duplicado',true);db.projects.unshift(c);persist();toast('Projeto duplicado');openProjects(activeFilter)}
function chooseList(id){const p=db.projects.find(x=>x.id===id);if(!p)return;openSheet('Mover para lista',`<div class="menu-list">${db.lists.map(l=>`<button class="menu-item" data-move-list="${l.id}"><span class="menu-icon">${icon('folder')}</span><span class="menu-copy"><b>${esc(l.name)}</b><small>${db.projects.filter(x=>x.listId===l.id&&!x.archived).length} projetos</small></span><span class="chev">›</span></button>`).join('')}<button class="menu-item" id="createListMove"><span class="menu-icon">${icon('plus')}</span><span class="menu-copy"><b>Criar nova lista</b><small>Organize do seu jeito</small></span><span class="chev">›</span></button></div>`);document.querySelectorAll('[data-move-list]').forEach(b=>b.onclick=()=>{p.listId=b.dataset.moveList;p.updatedAt=now();if(db.currentId===id){renderLists();$('listSelect').value=p.listId}persist();toast('Projeto movido');openProjects('all')});$('createListMove').onclick=()=>askInput('Nova lista','','Ex.: Clientes',name=>{const l=createList(name,false);if(l){p.listId=l.id;persist();renderLists();openProjects('all')}})}
function createList(name,reopen=true){name=name.trim();if(!name)return null;const l={id:'list_'+uid(),name};db.lists.push(l);persist();renderLists();toast('Lista criada');if(reopen)openProjects(activeFilter);return l}
function openVersions(id){const p=db.projects.find(x=>x.id===id);if(!p)return;const versions=p.versions||[];openSheet('Versões · '+p.name,versions.length?`<div class="section">VERSÕES AUTOMÁTICAS</div>${versions.map((v,i)=>`<div class="version-row"><div class="row-top"><span class="menu-icon">${icon('history')}</span><div class="row-main"><b>${i===0?'Versão mais recente':'Versão '+(versions.length-i)}</b><div class="meta">${esc(v.reason||'Automática')} · ${stamp(v.ts)}</div></div></div><div class="row-actions"><button class="rowbtn" data-view-ver="${v.id}">Visualizar</button><button class="rowbtn primary" data-restore-ver="${v.id}">Restaurar</button><button class="rowbtn" data-copy-ver="${v.id}">Duplicar</button></div></div>`).join('')}`:'<div class="empty">Ainda não há versões deste projeto.</div>');document.querySelectorAll('[data-view-ver]').forEach(b=>b.onclick=()=>viewVersion(p,b.dataset.viewVer));document.querySelectorAll('[data-restore-ver]').forEach(b=>b.onclick=()=>restoreVersion(p,b.dataset.restoreVer));document.querySelectorAll('[data-copy-ver]').forEach(b=>b.onclick=()=>duplicateVersion(p,b.dataset.copyVer))}
function viewVersion(p,id){const v=p.versions.find(x=>x.id===id);if(!v)return;$('fullPreview').srcdoc=v.html;$('fullscreen').classList.add('open');$('fullLabel').textContent='versão antiga';closeSheet()}
function restoreVersion(p,id){const v=p.versions.find(x=>x.id===id);if(!v)return;createVersion(p,'Antes de restaurar',true);p.html=v.html;p.name=v.name||p.name;p.listId=v.listId||p.listId;p.updatedAt=now();persist();if(db.currentId===p.id)loadProject(p.id);toast('Versão restaurada');openVersions(p.id)}
function duplicateVersion(p,id){const v=p.versions.find(x=>x.id===id);if(!v)return;const c={id:uid(),name:p.name.replace(/(\.html?)$/i,' - versao$1'),html:v.html,listId:v.listId||p.listId,updatedAt:now(),versions:[],archived:false};createVersion(c,'Criado a partir de versão',true);db.projects.unshift(c);persist();toast('Versão duplicada como projeto');openProjects('all')}
function askInput(title,value,placeholder,onSave){openSheet(title,`<label class="field-label">Digite abaixo</label><input class="input" id="askValue" value="${esc(value)}" placeholder="${esc(placeholder)}"><div class="dialog-actions"><button class="btn" id="askCancel">Cancelar</button><button class="btn primary" id="askSave">Salvar</button></div>`,true);$('askCancel').onclick=sheetBack;$('askSave').onclick=()=>{const v=$('askValue').value;if(!v.trim())return;onSave(v)}}
function openExports(){openSheet('Baixados / Exportados',db.exports.length?`<div class="section">HISTÓRICO</div>${db.exports.map(x=>`<div class="export-row"><div class="row-top"><span class="menu-icon">${icon('download')}</span><div class="row-main"><b>${esc(x.name)}</b><div class="meta">${stamp(x.ts)}</div></div></div></div>`).join('')}`:'<div class="empty">Nenhum HTML exportado ainda.</div>')}
function openSettings(){const s=db.settings;openSheet('Configurações',`<div id="settingsForm"><div class="section">EDITOR</div><div class="setting"><div><b>Salvamento automático</b><small>Guarda seu rascunho enquanto você digita.</small></div><input class="switch" id="sAuto" type="checkbox" ${s.autosave?'checked':''}></div><div class="setting"><div><b>Quebra de linha</b><small>Evita rolagem horizontal no editor.</small></div><input class="switch" id="sWrap" type="checkbox" ${s.wrap?'checked':''}></div><div class="setting"><div><b>Tamanho da fonte</b><small><span id="fontRead">${s.fontSize}</span> px</small></div><input class="range" id="sFont" type="range" min="11" max="22" value="${s.fontSize}"></div><div class="section">PRÉVIA</div><div class="setting"><div><b>Prévia automática</b><small>Atualiza depois de pequenas pausas ao digitar.</small></div><input class="switch" id="sPreview" type="checkbox" ${s.autoPreview?'checked':''}></div><div class="section">PROJETOS E VERSÕES</div><div class="setting"><div><b>Versões automáticas</b><small>Mantém até 20 pontos de restauração por projeto.</small></div><input class="switch" id="sVersions" type="checkbox" ${s.versions?'checked':''}></div><div class="project-row"><div class="row-top"><span class="menu-icon">${icon('archive')}</span><div class="row-main"><b>Proteção de projetos</b><div class="meta">Projetos não possuem exclusão direta nesta versão. Use Arquivar para esconder sem perder dados.</div></div></div></div><button class="btn primary wide" id="saveSettings">Salvar alterações</button></div>`);bindSettings()}
function bindSettings(){if(!$('settingsForm'))return;$('sFont').oninput=()=>$('fontRead').textContent=$('sFont').value;$('saveSettings').onclick=()=>{db.settings.autosave=$('sAuto').checked;db.settings.wrap=$('sWrap').checked;db.settings.fontSize=Number($('sFont').value);db.settings.autoPreview=$('sPreview').checked;db.settings.versions=$('sVersions').checked;persist();applySettings();toast('Configurações salvas');closeSheet()}}
function applySettings(){document.documentElement.style.setProperty('--editor',db.settings.fontSize+'px');$('code').style.whiteSpace=db.settings.wrap?'pre-wrap':'pre';$('saveState').textContent=db.settings.autosave?'Salvamento automático ativo':'Salvamento automático desligado';setPreviewZoom(db.settings.previewZoom,false);setDevice(db.settings.previewDevice,false)}
function openAbout(){openSheet('Sobre o CoderBuilder',`<div class="project-row"><div class="row-top"><span class="menu-icon">${icon('code')}</span><div class="row-main"><b>CoderBuilder 2.3.0-alpha.1</b><div class="meta">Cole. Crie. Execute.</div></div></div></div><div class="menu-list"><div class="menu-item"><span class="menu-icon">${icon('settings')}</span><span class="menu-copy"><b>Interface totalmente própria</b><small>Sem os pop-ups cinza padrão nas funções principais.</small></span></div><div class="menu-item"><span class="menu-icon">${icon('archive')}</span><span class="menu-copy"><b>Projetos protegidos</b><small>Arquivar substitui a exclusão simples.</small></span></div><div class="menu-item"><span class="menu-icon">${icon('history')}</span><span class="menu-copy"><b>Histórico automático</b><small>Restaure ou duplique versões antigas.</small></span></div></div>`)}
function previewToolsToggle(){ $('previewTools').classList.toggle('open') }
function setPreviewZoom(z,save=true){z=Math.max(50,Math.min(200,Number(z)));db.settings.previewZoom=z;document.documentElement.style.setProperty('--zoom',z/100);$('zoom100').textContent=z+'%';$('fullLabel').textContent=z+'%';updatePreviewLabel();if(save)persist()}
function setDevice(mode,save=true){db.settings.previewDevice=mode;[$('device'),$('fullDevice')].forEach(d=>{d.classList.remove('portrait','landscape');if(mode!=='auto')d.classList.add(mode)});document.querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('active',b.dataset.device===mode));updatePreviewLabel();if(save)persist()}
function updatePreviewLabel(){const m=db.settings.previewDevice==='portrait'?'Em pé':db.settings.previewDevice==='landscape'?'Deitado':'Auto';$('previewLabel').textContent=m+' · '+db.settings.previewZoom+'%'}
function openFullscreen(){ $('fullPreview').srcdoc=$('code').value;$('fullscreen').classList.add('open');$('previewTools').classList.remove('open') }
function closeFullscreen(){ $('fullscreen').classList.remove('open');$('fullPreview').srcdoc='' }
window.CoderBuilderApp={onNativeExportSuccess(){toast('HTML exportado')},handleBack(){if($('fullscreen').classList.contains('open')){closeFullscreen();return true}if($('previewTools').classList.contains('open')){$('previewTools').classList.remove('open');return true}if($('backdrop').classList.contains('open')){sheetBack();return true}return false}};
$('mainMenuBtn').onclick=mainMenu;$('sheetClose').onclick=closeSheet;$('sheetBack').onclick=sheetBack;$('backdrop').onclick=e=>{if(e.target===$('backdrop'))closeSheet()};$('previewToolsBtn').onclick=previewToolsToggle;$('refreshBtn').onclick=updatePreview;$('saveProjectBtn').onclick=()=>saveProject(true);$('exportBtn').onclick=()=>exportHtml(false);$('openBtn').onclick=()=>exportHtml(true);$('newBtn').onclick=newProject;$('toolRefresh').onclick=updatePreview;$('toolFull').onclick=openFullscreen;$('toolOpen').onclick=()=>exportHtml(true);$('fullBack').onclick=closeFullscreen;$('fullTools').onclick=()=>{closeFullscreen();$('previewTools').classList.add('open')};document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>setPreviewZoom(db.settings.previewZoom+Number(b.dataset.zoom)));$('zoom100').onclick=()=>setPreviewZoom(100);document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>setDevice(b.dataset.device));$('code').addEventListener('input',()=>{updateLineCount();scheduleSave();schedulePreview()});$('fileName').addEventListener('input',scheduleSave);$('listSelect').addEventListener('change',scheduleSave);document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x===b));const n=b.dataset.nav;if(n==='projects')openProjects();if(n==='settings')openSettings();if(n==='preview')$('previewCard').scrollIntoView({behavior:'smooth'});if(n==='editor')window.scrollTo({top:0,behavior:'smooth'})});document.addEventListener('click',e=>{if(!e.target.closest('#previewTools')&&!e.target.closest('#previewToolsBtn'))$('previewTools').classList.remove('open')});
load();renderLists();let p=current();if(p){$('fileName').value=p.name;$('code').value=p.html;renderLists();$('listSelect').value=p.listId||'geral'}else{$('code').value=DEFAULT_HTML}applySettings();updateLineCount();updatePreview();window.addEventListener('beforeunload',()=>{if(db.settings.autosave)saveProject(false)});
</script>
</body>
</html>
