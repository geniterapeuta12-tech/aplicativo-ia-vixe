<!doctype html>
<html lang="pt-BR">
<head>

<title>CoderBuilder 2.4</title>
<style>
:root{--bg:#07111f;--top:#050c17;--card:#0e1d31;--card2:#112641;--line:#23466f;--blue:#1479ff;--bright:#23a9ff;--cyan:#19d5d2;--text:#f4f8ff;--muted:#9fb2cc;--ok:#37d58a;--warn:#ffb454;--danger:#ff6178;--editor:13px;--zoom:1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}body{background:radial-gradient(circle at 80% -10%,#15345c 0,#07111f 35%,#050b14 100%);padding-bottom:72px}button,input,textarea,select{font:inherit}.hidden{display:none!important}.appbar{position:sticky;top:0;z-index:50;height:76px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(4,10,19,.98);border-bottom:1px solid #172b44}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#23a9ff,#1479ff 58%,#19d5d2);box-shadow:0 0 28px #1479ff44;font-weight:900}.brand{min-width:0;flex:1}.brand strong{display:block;font-size:22px}.brand small{color:var(--bright);font-size:12px}.round{width:46px;height:46px;border-radius:14px;border:1px solid #2b4f79;background:#0a1728;color:#ddecff;font-size:22px}.round:active,.btn:active,.chip:active,.rowbtn:active{transform:scale(.98)}main{padding:14px;max-width:1100px;margin:auto}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#10233a,#0b182a);padding:15px;margin-bottom:13px;box-shadow:inset 0 1px 0 #ffffff08}.title{display:flex;align-items:center;gap:8px;color:var(--cyan);font-size:13px;font-weight:800;letter-spacing:.04em;margin-bottom:12px}.field-label{display:block;color:var(--muted);font-size:12px;margin:10px 0 6px}.input,.select{width:100%;height:46px;border:1px solid #2b4d74;background:#071525;color:var(--text);border-radius:12px;padding:0 13px;outline:none}.input:focus,.select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1479ff22}.statusline{display:flex;align-items:center;gap:8px;color:var(--ok);font-size:12px;margin-top:11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px #37d58a88}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.chip{height:36px;border:1px solid #294f79;border-radius:10px;background:#0a1728;color:#cfe0f4;padding:0 11px}.chip.active{border-color:var(--blue);background:#0d2541;color:#6bc4ff}.chip.published{border-color:#2a7658;color:#6ee0a8;background:#0c2b24}.filetabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:9px}.filetab{height:38px;border:1px solid #294e77;border-radius:10px;background:#09192a;color:#c9d9eb;padding:0 12px;white-space:nowrap}.filetab.active{border-color:#188bff;color:#68c1ff;background:#0d2745}.filetab small{opacity:.65;margin-left:5px}.editor-head,.preview-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.editor-head .title,.preview-head .title{margin:0;flex:1}.pill{border:1px solid #2d527c;border-radius:999px;background:#0a1830;color:#77c7ff;padding:5px 9px;font-size:11px}.pill.ok{border-color:#2d7356;color:#70e0aa;background:#0b2922}textarea{width:100%;height:360px;resize:none;border:1px solid #284b73;background:#04101d;color:#d9e8fb;border-radius:14px;padding:14px;font:var(--editor)/1.55 Consolas,Monaco,monospace;outline:none;white-space:pre;overflow:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{min-height:44px;border:1px solid #2c4e76;border-radius:12px;background:#0a1728;color:#eaf4ff;font-weight:700;padding:9px 10px}.btn.primary{background:linear-gradient(135deg,#178bff,#1269f5);border-color:#2a95ff;box-shadow:0 8px 24px #1479ff2e}.btn.success{border-color:#2c8060;background:#0d3329;color:#7fe8b6}.btn.warn{border-color:#75552c;background:#2b2010;color:#ffc978}.btn.danger{border-color:#713547;background:#2c151d;color:#ff9bad}.btn.wide{grid-column:1/-1}.preview-stage{height:330px;border:1px solid #26486e;border-radius:14px;background:#04101d;display:grid;place-items:center;padding:8px;overflow:auto}.device{width:100%;height:100%;background:#fff;border-radius:10px;overflow:hidden;transition:.2s;box-shadow:0 14px 35px #0007}.device.portrait{width:min(310px,100%)}.device.landscape{height:220px}.preview-scale{width:100%;height:100%;overflow:auto;background:#fff}.preview-scale iframe{border:0;display:block;width:calc(100% / var(--zoom));height:calc(100% / var(--zoom));transform:scale(var(--zoom));transform-origin:top left;background:white}.project-row,.version-row,.file-row{border:1px solid #23466f;border-radius:14px;background:#0b1b2e;padding:12px;margin-bottom:9px}.row-top{display:flex;gap:10px;align-items:flex-start}.row-main{flex:1;min-width:0}.row-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:#8fa6c2;margin-top:4px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{border:1px solid #28517b;border-radius:999px;padding:3px 7px;color:#77c6ff;font-size:10px}.tag.ok{border-color:#2b7357;color:#75dda8}.row-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.rowbtn{height:35px;border:1px solid #2a4e78;border-radius:9px;background:#0a1728;color:#dbeaff;padding:0 10px}.rowbtn.primary{border-color:#1479ff;color:#66c0ff;background:#0c2038}.rowbtn.danger{border-color:#713547;color:#ff9bad;background:#2c151d}.backdrop{position:fixed;inset:0;z-index:80;background:#02060dbb;display:none}.backdrop.open{display:block}.sheet{position:absolute;left:10px;right:10px;bottom:10px;max-height:88vh;border:1px solid #31577f;border-radius:22px;background:linear-gradient(180deg,#0d2037,#071321);box-shadow:0 28px 90px #000c;overflow:hidden;display:grid;grid-template-rows:auto 1fr}.sheet-head{height:60px;display:flex;align-items:center;gap:10px;padding:0 15px;border-bottom:1px solid #203d5e;background:#091829}.sheet-head h2{margin:0;font-size:18px;flex:1}.sheet-body{overflow:auto;padding:14px}.menu-list{display:grid;gap:7px}.menu-item{width:100%;border:1px solid transparent;border-radius:14px;background:transparent;color:#eaf4ff;padding:12px;display:grid;grid-template-columns:1fr 18px;gap:10px;text-align:left}.menu-item:active{background:#112845;border-color:#294e77}.menu-copy b{display:block}.menu-copy small{display:block;color:#8ea6c3;margin-top:2px}.section{color:#64bfff;font-size:11px;font-weight:800;letter-spacing:.08em;margin:10px 2px 8px}.empty{text-align:center;color:#8096b4;padding:34px 10px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(18px);background:#102944;border:1px solid #3673ad;color:#ecf6ff;border-radius:11px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s;z-index:120}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:55;height:66px;background:rgba(4,10,19,.98);border-top:1px solid #1c3553;display:grid;grid-template-columns:repeat(4,1fr);padding:5px 8px}.navbtn{border:0;background:transparent;color:#8fa5c0;border-radius:12px;font-size:11px}.navbtn.active{color:#58b9ff;background:#0b203a}.notice{border:1px solid #6d552c;background:#2c2111;color:#ffd08b;border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}@media(min-width:820px){main{display:grid;grid-template-columns:360px 1fr;gap:13px}.editor-card{grid-row:span 2}.preview-card{grid-column:1/-1}.bottomnav{display:none}body{padding-bottom:0}.sheet{left:50%;right:auto;width:min(680px,92vw);transform:translateX(-50%)}}
</style>
</head>
<body>
<header class="appbar"><div class="logo">&lt;/&gt;</div><div class="brand"><strong>CoderBuilder</strong><small>2.4 alpha · Projetos + Versões</small></div><button class="round" id="moreBtn">⋮</button></header>
<main>
<section class="card">
<div class="title">PROJETO ATUAL</div>
<label class="field-label">Nome</label><input id="projectName" class="input" value="Meu projeto">
<div class="two"><div><label class="field-label">Versão ativa</label><select id="versionSelect" class="select"></select></div><div><label class="field-label">Status</label><div id="versionStatus" class="input" style="display:flex;align-items:center"></div></div></div>
<div class="statusline"><span class="dot"></span><span id="saveStatus">Salvo localmente</span></div>
</section>
<section class="card editor-card">
<div class="editor-head"><div class="title">EDITOR</div><span id="langPill" class="pill">HTML</span></div>
<div class="filetabs" id="fileTabs"></div>
<textarea id="code" spellcheck="false"></textarea>
<div class="actions" style="margin-top:10px"><button class="btn" id="addFileBtn">＋ Arquivo</button><button class="btn" id="renameFileBtn">Renomear</button><button class="btn wide primary" id="saveBtn">Salvar versão</button></div>
</section>
<section class="card">
<div class="title">VERSÃO</div>
<div class="actions"><button class="btn" id="newVersionBtn">＋ Nova versão</button><button class="btn success" id="publishBtn">Publicar versão</button><button class="btn" id="versionsBtn">Gerenciar versões</button><button class="btn" id="projectsBtn">Outros projetos</button></div>
</section>
<section class="card preview-card">
<div class="preview-head"><div class="title">PRÉ-VISUALIZAÇÃO</div><span id="previewPill" class="pill ok">Executável</span></div>
<div class="toolbar"><button class="chip" data-zoom="-10">−</button><button class="chip" id="zoomRead">100%</button><button class="chip" data-zoom="10">＋</button><button class="chip active" data-device="auto">Auto</button><button class="chip" data-device="portrait">Retrato</button><button class="chip" data-device="landscape">Paisagem</button></div>
<div class="preview-stage" style="margin-top:10px"><div id="device" class="device"><div class="preview-scale"><iframe id="preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></div></div></div>
<div class="actions" style="margin-top:10px"><button class="btn primary" id="runBtn">▶ Executar</button><button class="btn" id="exportBtn">↓ Exportar HTML</button></div>
</section>
</main>
<nav class="bottomnav"><button class="navbtn active" id="navEditor">Editor</button><button class="navbtn" id="navProjects">Projetos</button><button class="navbtn" id="navVersions">Versões</button><button class="navbtn" id="navPreview">Prévia</button></nav>
<div class="backdrop" id="sheet"><div class="sheet"><div class="sheet-head"><h2 id="sheetTitle">Menu</h2><button class="round" id="closeSheet">×</button></div><div class="sheet-body" id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),now=()=>Date.now();
const EXT={html:'HTML',htm:'HTML',css:'CSS',js:'JavaScript',json:'JSON',md:'Markdown',txt:'Texto',py:'Python',ts:'TypeScript',jsx:'JSX',tsx:'TSX',xml:'XML',yml:'YAML',yaml:'YAML'};
const EXEC=new Set(['html','htm','css','js']);
let db,activeFileId,zoom=100,deviceMode='auto',saveTimer;
function seed(){return{currentProjectId:'p1',projects:[{id:'p1',name:'Meu projeto',currentVersionId:'v1',publishedVersionId:null,updatedAt:now(),versions:[{id:'v1',name:'Versão 1',number:1,status:'editing',createdAt:now(),updatedAt:now(),files:[{id:'f1',name:'index.html',content:'<!doctype html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Meu projeto</title>\n<link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <main>\n    <h1>Olá, CoderBuilder!</h1>\n    <button id="btn">Clique aqui</button>\n  </main>\n  <script src="script.js"><\\/script>\n</body>\n</html>'},{id:'f2',name:'style.css',content:'body{margin:0;font-family:Arial,sans-serif;background:#0d1117;color:white;min-height:100vh;display:grid;place-items:center}main{text-align:center}button{padding:12px 18px;border:0;border-radius:10px;background:#1479ff;color:white}'},{id:'f3',name:'script.js',content:'document.getElementById("btn")?.addEventListener("click",()=>alert("Funcionou!"));'}]}]}]};}
function load(){try{db=JSON.parse(localStorage.getItem('coderbuilder_v24')||'null')}catch(e){}if(!db||!db.projects)db=seed();migrate();const v=currentVersion();activeFileId=v.files[0]?.id;renderAll();}
function migrate(){db.projects.forEach(p=>{p.versions=p.versions||[];if(!p.versions.length){p.versions=[{id:uid(),name:'Versão 1',number:1,status:'editing',createdAt:now(),updatedAt:now(),files:[{id:uid(),name:'index.html',content:p.html||''}]}]}p.currentVersionId=p.currentVersionId||p.versions[0].id;p.publishedVersionId=p.publishedVersionId||null});}
function persist(){localStorage.setItem('coderbuilder_v24',JSON.stringify(db));$('saveStatus').textContent='Salvo localmente';}
function project(){return db.projects.find(p=>p.id===db.currentProjectId)||db.projects[0]}
function currentVersion(){const p=project();return p.versions.find(v=>v.id===p.currentVersionId)||p.versions[0]}
function currentFile(){const v=currentVersion();return v.files.find(f=>f.id===activeFileId)||v.files[0]}
function ext(n){return(n.split('.').pop()||'txt').toLowerCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1800)}
function renderAll(){renderProject();renderVersionsSelect();renderFiles();renderEditor();renderPreviewStatus();updatePreview();}
function renderProject(){$('projectName').value=project().name}
function renderVersionsSelect(){const p=project(),s=$('versionSelect');s.innerHTML='';p.versions.forEach(v=>{const o=document.createElement('option');o.value=v.id;o.textContent=`v${v.number} · ${v.name}${p.publishedVersionId===v.id?' · publicada':''}`;s.appendChild(o)});s.value=p.currentVersionId;const v=currentVersion();$('versionStatus').innerHTML=p.publishedVersionId===v.id?'<span style="color:#70e0aa">● Publicada</span>':'<span style="color:#77c7ff">● Em edição</span>';}
function renderFiles(){const box=$('fileTabs'),v=currentVersion();box.innerHTML='';v.files.forEach(f=>{const b=document.createElement('button');b.className='filetab '+(f.id===activeFileId?'active':'');b.innerHTML=esc(f.name)+`<small>${EXT[ext(f.name)]||ext(f.name).toUpperCase()}</small>`;b.onclick=()=>{saveEditor();activeFileId=f.id;renderFiles();renderEditor();renderPreviewStatus()};box.appendChild(b)})}
function renderEditor(){const f=currentFile();$('code').value=f?.content||'';$('langPill').textContent=EXT[ext(f?.name||'txt')]||ext(f?.name||'txt').toUpperCase()}
function saveEditor(){const f=currentFile();if(!f)return;f.content=$('code').value;currentVersion().updatedAt=now();project().updatedAt=now();persist()}
function scheduleSave(){clearTimeout(saveTimer);$('saveStatus').textContent='Salvando…';saveTimer=setTimeout(()=>{saveEditor();$('saveStatus').textContent='Salvo localmente'},500)}
function compose(v=currentVersion()){const htmlFile=v.files.find(f=>['html','htm'].includes(ext(f.name)));if(!htmlFile)return null;let html=htmlFile.content;const css=v.files.filter(f=>ext(f.name)==='css').map(f=>`<style data-coderbuilder="${esc(f.name)}">\n${f.content}\n</style>`).join('\n');const js=v.files.filter(f=>ext(f.name)==='js').map(f=>`<script data-coderbuilder="${esc(f.name)}">\n${f.content}\n<\\/script>`).join('\n');html=html.replace(/<link[^>]+href=["'][^"']+\.css["'][^>]*>/gi,'').replace(/<script[^>]+src=["'][^"']+\.js["'][^>]*><\\/script>/gi,'');if(/<\\/head>/i.test(html))html=html.replace(/<\\/head>/i,css+'\n</head>');else html=css+html;if(/<\\/body>/i.test(html))html=html.replace(/<\\/body>/i,js+'\n</body>');else html+=js;return html}
function updatePreview(){const html=compose();if(html){$('preview').srcdoc=html;$('runBtn').disabled=false;$('exportBtn').disabled=false}else{$('preview').srcdoc='<body style="font-family:Arial;background:#fff;color:#333;padding:30px"><h2>Sem arquivo HTML</h2><p>Esta versão pode ser editada e salva, mas precisa de um arquivo .html para executar a prévia.</p></body>';$('runBtn').disabled=true;$('exportBtn').disabled=true}}
function renderPreviewStatus(){const f=currentFile(),e=ext(f?.name||'');if(EXEC.has(e)){$('previewPill').textContent='Executável';$('previewPill').className='pill ok'}else{$('previewPill').textContent='Somente edição';$('previewPill').className='pill';}}
function newVersion(){saveEditor();const p=project(),src=currentVersion(),num=Math.max(0,...p.versions.map(v=>v.number||0))+1;const v={id:uid(),name:'Versão '+num,number:num,status:'editing',createdAt:now(),updatedAt:now(),files:src.files.map(f=>({id:uid(),name:f.name,content:f.content}))};p.versions.push(v);p.currentVersionId=v.id;activeFileId=v.files[0]?.id;persist();renderAll();toast('Nova versão criada')}
function publishCurrent(){saveEditor();const p=project(),v=currentVersion();if(!compose(v)){toast('Adicione um arquivo HTML antes de publicar');return}p.publishedVersionId=v.id;v.status='published';p.versions.forEach(x=>{if(x.id!==v.id&&x.status==='published')x.status='editing'});persist();renderVersionsSelect();toast(`v${v.number} publicada`)}
function deleteVersion(id){const p=project();if(p.versions.length<=1){toast('O projeto precisa ter pelo menos uma versão');return}if(p.publishedVersionId===id){toast('Publique outra versão antes de apagar esta');return}if(!confirm('Apagar esta versão?'))return;p.versions=p.versions.filter(v=>v.id!==id);if(p.currentVersionId===id)p.currentVersionId=p.versions[p.versions.length-1].id;const v=currentVersion();activeFileId=v.files[0]?.id;persist();renderAll();showVersions();}
function duplicateVersion(id){const p=project(),src=p.versions.find(v=>v.id===id);if(!src)return;const num=Math.max(...p.versions.map(v=>v.number))+1;const v={id:uid(),name:'Versão '+num,number:num,status:'editing',createdAt:now(),updatedAt:now(),files:src.files.map(f=>({id:uid(),name:f.name,content:f.content}))};p.versions.push(v);p.currentVersionId=v.id;activeFileId=v.files[0]?.id;persist();renderAll();closeSheet();toast('Versão duplicada')}
function openVersion(id){saveEditor();project().currentVersionId=id;const v=currentVersion();activeFileId=v.files[0]?.id;persist();renderAll();closeSheet()}
function addFile(){const name=prompt('Nome do arquivo (ex.: dados.json):','novo.txt');if(!name?.trim())return;const v=currentVersion();v.files.push({id:uid(),name:name.trim(),content:''});activeFileId=v.files[v.files.length-1].id;persist();renderFiles();renderEditor();renderPreviewStatus()}
function renameFile(){const f=currentFile();if(!f)return;const n=prompt('Novo nome do arquivo:',f.name);if(!n?.trim())return;f.name=n.trim();persist();renderFiles();renderEditor();renderPreviewStatus();updatePreview()}
function createProject(){const name=prompt('Nome do novo projeto:','Novo projeto');if(!name?.trim())return;const p={id:uid(),name:name.trim(),currentVersionId:null,publishedVersionId:null,updatedAt:now(),versions:[]};const v={id:uid(),name:'Versão 1',number:1,status:'editing',createdAt:now(),updatedAt:now(),files:[{id:uid(),name:'index.html',content:'<!doctype html>\n<html lang="pt-BR">\n<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo projeto</title></head>\n<body>\n  <h1>Novo projeto</h1>\n</body>\n</html>'}]};p.versions.push(v);p.currentVersionId=v.id;db.projects.push(p);db.currentProjectId=p.id;activeFileId=v.files[0].id;persist();renderAll();toast('Projeto criado')}
function openProject(id){saveEditor();db.currentProjectId=id;const v=currentVersion();activeFileId=v.files[0]?.id;persist();renderAll();closeSheet()}
function showVersions(){const p=project();openSheet('Versões',`<button class="btn primary" style="width:100%;margin-bottom:10px" onclick="newVersion();closeSheet()">＋ Criar nova versão</button>`+p.versions.slice().reverse().map(v=>`<div class="version-row"><div class="row-top"><div class="row-main"><b>v${v.number} · ${esc(v.name)}</b><div class="meta">${p.publishedVersionId===v.id?'Publicada':'Em edição'} · ${v.files.length} arquivo(s)</div><div class="tags">${p.currentVersionId===v.id?'<span class="tag">aberta agora</span>':''}${p.publishedVersionId===v.id?'<span class="tag ok">publicada</span>':''}</div></div></div><div class="row-actions"><button class="rowbtn primary" onclick="openVersion('${v.id}')">Abrir</button><button class="rowbtn" onclick="duplicateVersion('${v.id}')">Duplicar</button>${p.publishedVersionId===v.id?'':`<button class="rowbtn" onclick="project().currentVersionId='${v.id}';publishCurrent();showVersions()">Publicar</button>`}${p.versions.length>1&&p.publishedVersionId!==v.id?`<button class="rowbtn danger" onclick="deleteVersion('${v.id}')">Apagar</button>`:''}</div></div>`).join(''))}
function showProjects(){openSheet('Projetos',`<button class="btn primary" style="width:100%;margin-bottom:10px" onclick="createProject();closeSheet()">＋ Novo projeto</button>`+db.projects.slice().sort((a,b)=>b.updatedAt-a.updatedAt).map(p=>`<div class="project-row"><div class="row-main"><b>${esc(p.name)}</b><div class="meta">${p.versions.length} versão(ões) · ${p.publishedVersionId?'tem versão publicada':'não publicado'}</div></div><div class="row-actions"><button class="rowbtn primary" onclick="openProject('${p.id}')">Abrir</button></div></div>`).join(''))}
function showMenu(){openSheet('CoderBuilder',`<div class="menu-list"><button class="menu-item" onclick="showProjects()"><span class="menu-copy"><b>Projetos</b><small>Abrir ou criar projetos</small></span><span>›</span></button><button class="menu-item" onclick="showVersions()"><span class="menu-copy"><b>Versões</b><small>Publicar, abrir, duplicar ou apagar versões</small></span><span>›</span></button><button class="menu-item" onclick="showSupport()"><span class="menu-copy"><b>Tipos de código</b><small>Veja o que pode ser executado</small></span><span>›</span></button><button class="menu-item" onclick="showAbout()"><span class="menu-copy"><b>Sobre</b><small>CoderBuilder 2.4 alpha</small></span><span>›</span></button></div>`)}
function showSupport(){openSheet('Tipos de código',`<div class="notice">HTML, CSS e JavaScript podem participar da prévia. Outros arquivos podem ser editados e salvos, mas não são executados nesta versão.</div><div class="file-row"><b>Executáveis na prévia</b><div class="meta">HTML · CSS · JavaScript</div></div><div class="file-row"><b>Edição e armazenamento</b><div class="meta">JSON · Markdown · TXT · Python · TypeScript · JSX/TSX · XML · YAML</div></div><div class="file-row"><b>Python</b><div class="meta">Arquivos .py podem ser editados e salvos. O CoderBuilder 2.4 não executa Python.</div></div>`)}
function showAbout(){openSheet('Sobre',`<div class="file-row"><b>CoderBuilder 2.4.0-alpha.1</b><div class="meta">Cole. Crie. Execute.</div></div><div class="file-row"><b>Nesta versão</b><div class="meta">Projetos com versões reais, versão publicada, vários arquivos por versão e suporte a mais tipos de código.</div></div><div class="notice">Os dados desta versão continuam salvos no próprio aparelho. A integração com Supabase ainda não foi ativada.</div>`)}
function openSheet(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('sheet').classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open')}
function exportCurrent(){saveEditor();const html=compose();if(!html){toast('Esta versão não tem HTML executável');return}const name=(project().name||'projeto').replace(/[^a-z0-9_-]+/gi,'_')+'.html';if(window.CoderBuilderNative?.exportHtml)CoderBuilderNative.exportHtml(name,html,false);else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)} }
$('code').addEventListener('input',()=>{scheduleSave();if(['html','htm','css','js'].includes(ext(currentFile()?.name||'')))setTimeout(updatePreview,180)});
$('projectName').addEventListener('input',()=>{project().name=$('projectName').value;project().updatedAt=now();scheduleSave()});
$('versionSelect').onchange=e=>openVersion(e.target.value);$('saveBtn').onclick=()=>{saveEditor();toast('Versão salva')};$('newVersionBtn').onclick=newVersion;$('publishBtn').onclick=publishCurrent;$('versionsBtn').onclick=showVersions;$('projectsBtn').onclick=showProjects;$('addFileBtn').onclick=addFile;$('renameFileBtn').onclick=renameFile;$('runBtn').onclick=()=>{saveEditor();updatePreview();toast('Prévia atualizada')};$('exportBtn').onclick=exportCurrent;$('moreBtn').onclick=showMenu;$('closeSheet').onclick=closeSheet;$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet()});
$('navProjects').onclick=showProjects;$('navVersions').onclick=showVersions;$('navPreview').onclick=()=>document.querySelector('.preview-card').scrollIntoView({behavior:'smooth'});$('navEditor').onclick=()=>document.querySelector('.editor-card').scrollIntoView({behavior:'smooth'});
document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{zoom=Math.max(50,Math.min(200,zoom+Number(b.dataset.zoom)));document.documentElement.style.setProperty('--zoom',zoom/100);$('zoomRead').textContent=zoom+'%'});$('zoomRead').onclick=()=>{zoom=100;document.documentElement.style.setProperty('--zoom',1);$('zoomRead').textContent='100%'};document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{deviceMode=b.dataset.device;document.querySelectorAll('[data-device]').forEach(x=>x.classList.toggle('active',x===b));$('device').className='device '+(deviceMode==='auto'?'':deviceMode)});
window.CoderBuilderApp={handleBack(){if($('sheet').classList.contains('open')){closeSheet();return true}return false},onNativeExportSuccess(){toast('HTML exportado')}};
load();
</script>
</body>
</html>
