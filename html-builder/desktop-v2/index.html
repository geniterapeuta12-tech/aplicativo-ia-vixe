<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoderBuilder 2.0</title>
<style>
:root{--bg:#07111f;--elev:#0b1728;--card:#0e1d31;--card2:#132844;--border:#23466f;--blue:#1479ff;--bright:#23a9ff;--cyan:#19d5d2;--text:#f4f8ff;--muted:#a8b7ce;--ok:#37d58a;--warn:#ffb454;--radius:16px}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 70% 0,#102c56 0,#07111f 34%,#050b14 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:58px 1fr 36px}.titlebar{display:flex;align-items:center;gap:12px;padding:0 18px;background:rgba(5,12,23,.92);border-bottom:1px solid #1b2c43}.mini-logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(145deg,var(--bright),var(--blue),var(--cyan));box-shadow:0 0 24px #1479ff55;font-weight:900;color:#04101e}.brand{font-weight:800}.brand span{color:var(--bright)}.nav{display:flex;gap:8px;margin-left:34px}.nav button,.ghost{height:36px;border:1px solid #243a59;border-radius:10px;background:#0a1423;color:var(--text);padding:0 15px;cursor:pointer}.nav button.active{border-color:var(--blue);color:#5db7ff;background:#0c1b31}.spacer{flex:1}.workspace{min-height:0;display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px}.sidebar{min-height:0;display:flex;flex-direction:column;gap:12px}.panel{background:linear-gradient(180deg,rgba(18,34,56,.92),rgba(9,20,35,.94));border:1px solid #243a59;border-radius:var(--radius);box-shadow:inset 0 1px 0 #ffffff08,0 16px 50px #00000022}.side-card{padding:16px}.section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#dce9fb;font-weight:800;margin-bottom:12px}.label{font-size:12px;color:var(--muted);margin-bottom:7px}.input{width:100%;height:44px;border:1px solid #294363;border-radius:11px;background:#0a1423;color:var(--text);padding:0 12px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1479ff22}.path-row{display:flex;gap:8px;margin-top:10px}.path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.btn{width:100%;height:44px;border:1px solid #294363;border-radius:11px;background:#0b1727;color:var(--text);font-weight:700;cursor:pointer;margin-top:9px}.btn:hover{border-color:#3b6da8;background:#10213a}.btn.primary{background:linear-gradient(135deg,#178bff,#1269f5);border-color:#2a95ff;box-shadow:0 8px 26px #1479ff30}.tip{font-size:13px;line-height:1.6;color:var(--muted)}.tip strong{color:#6bc2ff}.main{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(280px,1.2fr) minmax(210px,.8fr);gap:12px}.editor-panel,.preview-panel{min-height:0;overflow:hidden;display:grid}.editor-panel{grid-template-rows:48px 1fr}.preview-panel{grid-template-rows:46px 1fr}.panel-head{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #243a59;background:#0c1727}.tab{height:34px;display:flex;align-items:center;padding:0 12px;border-radius:9px 9px 0 0;background:#0a1423;border:1px solid #243a59;border-bottom-color:#0a1423;color:#75bfff;font-weight:700}.head-spacer{flex:1}.badge{font-size:12px;padding:7px 10px;border-radius:9px;border:1px solid #294363;background:#0a1423;color:#dbe8f8}textarea{resize:none;width:100%;height:100%;border:0;outline:0;background:linear-gradient(135deg,#07111f,#09172a);color:#dbe8f8;padding:18px 20px;font:14px/1.6 Consolas,Monaco,monospace;tab-size:2;caret-color:#52b9ff}iframe{width:100%;height:100%;border:0;background:white}.preview-wrap{min-height:0;background:#fff}.status{display:flex;align-items:center;gap:14px;padding:0 18px;background:#050c16;border-top:1px solid #1b2c43;color:#8ea3be;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px #37d58a88}.status .right{margin-left:auto;display:flex;gap:18px}.mobile-actions{display:none}@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.workspace{grid-template-columns:1fr}.main{grid-template-rows:430px 320px}.sidebar{display:grid;grid-template-columns:1fr 1fr}.tips{display:none}.status{position:sticky;bottom:0}.nav{display:none}}@media(max-width:620px){.sidebar{grid-template-columns:1fr}.workspace{padding:9px}.main{grid-template-rows:470px 300px}.titlebar{padding:0 12px}.brand{font-size:15px}}
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="mini-logo">&lt;/&gt;</div><div class="brand">Coder<span>Builder</span></div>
    <nav class="nav"><button class="active">&lt;/&gt; EDITOR</button><button id="focusPreview">◉ VISUALIZAR</button><button>⚙ CONFIGURAÇÕES</button></nav>
    <div class="spacer"></div><button class="ghost" id="about">? SOBRE</button>
  </header>

  <section class="workspace">
    <aside class="sidebar">
      <div class="panel side-card">
        <div class="section-title">▣ Arquivo</div>
        <div class="label">Nome do arquivo</div>
        <input id="fileName" class="input" value="meu_site.html" spellcheck="false">
        <div class="label" style="margin-top:13px">Local para salvar</div>
        <div class="path-row"><div class="input path" style="display:flex;align-items:center">Downloads</div><button class="ghost">ALTERAR</button></div>
      </div>
      <div class="panel side-card">
        <div class="section-title">⚡ Ações</div>
        <button class="btn primary" id="save">▣ SALVAR HTML</button>
        <button class="btn" id="open">◎ ABRIR NO NAVEGADOR</button>
        <button class="btn" id="refresh">↻ ATUALIZAR PRÉVIA</button>
        <button class="btn" id="newFile">＋ NOVO ARQUIVO</button>
      </div>
      <div class="panel side-card tips">
        <div class="section-title">💡 Dicas</div>
        <div class="tip">Cole seu <strong>código HTML</strong> no editor, visualize em tempo real e depois <strong>salve</strong> o arquivo para abrir em qualquer navegador.</div>
      </div>
    </aside>

    <main class="main">
      <section class="panel editor-panel">
        <div class="panel-head"><div class="tab" id="tabName">meu_site.html ×</div><div class="head-spacer"></div><div class="badge">HTML ▾</div></div>
        <textarea id="code" spellcheck="false"><!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meu Site</title>
  <style>
    body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#0d1117,#1a1f2e);color:white;min-height:100vh;display:grid;place-items:center}
    .box{text-align:center;max-width:700px;padding:48px}
    h1{font-size:48px;margin:0 0 12px}
    p{color:#c8d2e1;font-size:18px}
    button{margin-top:18px;padding:13px 24px;border:0;border-radius:10px;background:#1479ff;color:white;font-weight:700}
  </style>
</head>
<body>
  <div class="box">
    <h1>Meu Site</h1>
    <p>Bem-vindo ao meu site criado com CoderBuilder!</p>
    <button>Vamos codar! 🚀</button>
  </div>
</body>
</html></textarea>
      </section>
      <section class="panel preview-panel" id="previewPanel">
        <div class="panel-head"><span style="color:#55b9ff">◉</span><strong style="font-size:13px">VISUALIZAÇÃO</strong><div class="head-spacer"></div><button class="ghost" id="refresh2">↻ ATUALIZAR</button><button class="ghost" id="open2">↗ NOVA ABA</button></div>
        <div class="preview-wrap"><iframe id="preview" title="Pré-visualização"></iframe></div>
      </section>
    </main>
  </section>

  <footer class="status"><span>CoderBuilder v2.0.0-alpha.1</span><span class="dot"></span><span id="state">Pronto</span><div class="right"><span id="lines">Linhas: 1</span><span>Tema: Dark</span></div></footer>
</div>
<script>
const code=document.getElementById('code'),preview=document.getElementById('preview'),fileName=document.getElementById('fileName'),tabName=document.getElementById('tabName'),state=document.getElementById('state'),lines=document.getElementById('lines');
function normalizedName(){let n=fileName.value.trim()||'pagina.html';if(!/\.html?$/i.test(n))n+='.html';return n}
function updatePreview(){preview.srcdoc=code.value;state.textContent='Prévia atualizada';lines.textContent='Linhas: '+code.value.split('\n').length}
function download(){const blob=new Blob([code.value],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=normalizedName();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);state.textContent='HTML salvo'}
function openTab(){const blob=new Blob([code.value],{type:'text/html;charset=utf-8'});window.open(URL.createObjectURL(blob),'_blank')}
let timer;code.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(updatePreview,180);lines.textContent='Linhas: '+code.value.split('\n').length});
fileName.addEventListener('input',()=>tabName.textContent=(fileName.value||'sem_nome.html')+' ×');
document.getElementById('save').onclick=download;document.getElementById('open').onclick=openTab;document.getElementById('open2').onclick=openTab;document.getElementById('refresh').onclick=updatePreview;document.getElementById('refresh2').onclick=updatePreview;document.getElementById('focusPreview').onclick=()=>document.getElementById('previewPanel').scrollIntoView({behavior:'smooth'});document.getElementById('newFile').onclick=()=>{if(confirm('Criar um novo arquivo e limpar o editor?')){fileName.value='novo_arquivo.html';tabName.textContent='novo_arquivo.html ×';code.value='<!doctype html>\n<html lang="pt-BR">\n<head>\n  <meta charset="utf-8">\n  <title>Novo arquivo</title>\n</head>\n<body>\n\n</body>\n</html>';updatePreview()}};document.getElementById('about').onclick=()=>alert('CoderBuilder 2.0 alpha — Cole. Crie. Execute.');
updatePreview();
</script>
</body>
</html>
