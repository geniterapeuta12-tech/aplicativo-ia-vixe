<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livres para Adorar</title><style>
:root{--bg:#070b12;--side:#09111e;--card:#0e1928;--line:#203044;--text:#f7f8fa;--muted:#8e9bad;--gold:#e9b640;--gold2:#ffca55;--danger:#ff5a5a}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,Arial;background:var(--bg);color:var(--text)}body.light{--bg:#f7f8fa;--side:#fff;--card:#fff;--line:#e3e7ed;--text:#161b22;--muted:#697386}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.app.c{grid-template-columns:76px 1fr}aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 22px}.mark{font-size:32px;color:var(--gold)}.bn{font-weight:800;letter-spacing:2px}.bn small{display:block;color:var(--gold);font-size:10px;letter-spacing:4px}.nav button{width:100%;border:0;background:transparent;color:var(--text);padding:12px;border-radius:10px;text-align:left;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#6d501d55;color:var(--gold2)}.nav i{display:inline-block;width:25px;font-style:normal}.c .txt,.c .bn{display:none}.collapse{position:absolute;bottom:18px;left:12px;right:12px}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:5px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 14px;border-radius:9px;cursor:pointer}.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));border:0;color:#151008;font-weight:700}.danger{color:var(--danger)}.toolbar{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:var(--card);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:9px;outline:none}.toolbar input{min-width:280px}.cats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.chip{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}.chip b{color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.video{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.thumb{height:128px;background:linear-gradient(135deg,#152c4a,#1b0f10);display:grid;place-items:center;font-size:38px;color:var(--gold)}.vbody{padding:12px}.vtitle{font-weight:750;font-size:15px}.meta{color:var(--muted);font-size:12px;margin:5px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{padding:6px 8px}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}.row{display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0}.row:last-child{border:0}.field{display:grid;gap:7px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:10}.modal.show{display:grid}.box{background:var(--side);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(680px,100%);max-height:90vh;overflow:auto}.box h2{margin-top:0}.status{font-size:12px;color:#6bd48c}.toast{position:fixed;right:20px;bottom:20px;background:#172333;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:20}.list .grid{display:block}.list .video{margin-bottom:9px;display:grid;grid-template-columns:160px 1fr}.list .thumb{height:100%}@media(max-width:760px){.app,.app.c{grid-template-columns:1fr}aside{height:auto;position:relative;padding:10px;display:flex;align-items:center;overflow:auto}.brand{padding:0 12px 0 0}.nav{display:flex;white-space:nowrap}.nav button{width:auto}.collapse{display:none}.main{padding:18px}.form{grid-template-columns:1fr}.full{grid-column:auto}.toolbar input{min-width:100%;flex:1}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.txt{display:none}.bn{display:none}}
</style></head><body><div class="app" id="app"><aside><div class="brand"><div class="mark">♫✝</div><div class="bn">LIVRES<small>PARA ADORAR</small></div></div><div class="nav" id="nav"></div><button class="btn collapse" onclick="toggleSide()">⇤ <span class="txt">Recolher</span></button></aside><main class="main" id="main"></main></div><div class="modal" id="modal"><div class="box" id="box"></div></div><div class="toast" id="toast"></div><script>
const URL='https://lfrynemcdlcuwhhpgkou.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcnluZW1jZGxjdXdoaHBna291Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMDE3MTQsImV4cCI6MjA5ODc3NzcxNH0.T1gQCXeS7LKj8--WHVlPGIw9rN1blz62sKwpGQaAR5w',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};let cats=[],vids=[],settings={theme:'dark',view_mode:'grid',sidebar_collapsed:false},view='videos',q='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){let r=await fetch(URL+'/rest/v1/'+path,{...opt,headers:{...H,...opt.headers}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}function toast(x){let t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}function closeM(){$('#modal').classList.remove('show')}function modal(h){$('#box').innerHTML=h;$('#modal').classList.add('show')}
const nav=[['videos','▣','Vídeos'],['categories','▤','Categorias'],['favorites','☆','Favoritos'],['archived','▧','Arquivados'],['backup','♙','Backup'],['settings','⚙','Configurações']];function drawNav(){$('#nav').innerHTML=nav.map(n=>`<button class="${view==n[0]?'active':''}" onclick="go('${n[0]}')"><i>${n[1]}</i><span class="txt">${n[2]}</span></button>`).join('')}function go(v){view=v;drawNav();render()}function catName(id){return cats.find(c=>c.id===id)?.name||'Sem categoria'}function fmt(d){return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):''}
async function load(){try{[cats,vids]=await Promise.all([api('lpa_categories?select=*&order=sort_order'),api('lpa_videos?select=*&order=created_at.desc')]);let s=await api('lpa_settings?id=eq.app&select=*');if(s?.[0])settings=s[0];apply();drawNav();render()}catch(e){drawNav();$('#main').innerHTML='<div class="empty">Não foi possível conectar ao Supabase.<br>'+esc(e.message)+'</div>'}}function apply(){document.body.classList.toggle('light',settings.theme==='light'||(settings.theme==='system'&&matchMedia('(prefers-color-scheme:light)').matches));$('#app').classList.toggle('c',!!settings.sidebar_collapsed);document.body.classList.toggle('list',settings.view_mode==='list')}
function header(t,s,btn=''){return `<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div>${btn}</div>`}function videoCards(list){if(!list.length)return '<div class="empty">Nenhum vídeo aqui ainda.</div>';return `<div class="grid">${list.map(v=>`<div class="video"><div class="thumb">▶</div><div class="vbody"><div class="vtitle">${esc(v.title)}</div><div class="meta">${esc(catName(v.category_id))}${v.video_date?' · '+fmt(v.video_date):''}</div><div class="actions"><button class="btn" onclick="fav('${v.id}',${!v.favorite})">${v.favorite?'★':'☆'}</button><button class="btn" onclick="archive('${v.id}',${!v.archived})">${v.archived?'Restaurar':'Arquivar'}</button>${v.storage_path?`<button class="btn" onclick="play('${esc(v.storage_path)}')">Abrir</button>`:''}<button class="btn danger" onclick="delVideo('${v.id}','${esc(v.storage_path||'')}')">Excluir</button></div></div></div>`).join('')}</div>`}
function render(){apply();if(view==='videos'){let f=vids.filter(v=>!v.archived&&(!q||v.title.toLowerCase().includes(q.toLowerCase())));$('#main').innerHTML=header('Biblioteca de Vídeos','Sua biblioteca de louvores e conteúdos','<button class="btn primary" onclick="addVideo()">＋ Adicionar vídeo</button>')+`<div class="toolbar"><input placeholder="Buscar vídeos..." value="${esc(q)}" oninput="q=this.value;render()"><select onchange="filterCat(this.value)"><option value="">Todas as categorias</option>${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="btn" onclick="toggleView()">▦/☷</button></div><div class="cats">${cats.map(c=>`<div class="chip"><b>${esc(c.name)}</b> · ${vids.filter(v=>v.category_id===c.id&&!v.archived).length}</div>`).join('')}</div><div id="cards">${videoCards(f)}</div>`}else if(view==='favorites')$('#main').innerHTML=header('Favoritos','Seus vídeos favoritos')+videoCards(vids.filter(v=>v.favorite&&!v.archived));else if(view==='archived')$('#main').innerHTML=header('Arquivados','Vídeos guardados fora da lista principal')+videoCards(vids.filter(v=>v.archived));else if(view==='categories')renderCats();else if(view==='backup')renderBackup();else renderSettings()}
function filterCat(id){$('#cards').innerHTML=videoCards(vids.filter(v=>!v.archived&&(!id||v.category_id===id)&&(!q||v.title.toLowerCase().includes(q.toLowerCase()))))}async function fav(id,val){await api('lpa_videos?id=eq.'+id,{method:'PATCH',body:JSON.stringify({favorite:val,updated_at:new Date().toISOString()}),headers:{Prefer:'return=minimal'}});await load()}async function archive(id,val){await api('lpa_videos?id=eq.'+id,{method:'PATCH',body:JSON.stringify({archived:val,updated_at:new Date().toISOString()}),headers:{Prefer:'return=minimal'}});await load()}
function addVideo(){modal(`<h2>Adicionar vídeo</h2><div class="form"><div class="field full"><label>Arquivo</label><input id="vf" type="file" accept="video/*"></div><div class="field"><label>Título</label><input id="vt"></div><div class="field"><label>Categoria</label><select id="vc">${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="vd" type="date"></div><div class="field"><label>Ministério/cantor</label><input id="vm"></div><div class="field full"><label>Observações</label><textarea id="vn"></textarea></div></div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveVideo()">Salvar vídeo</button></div>`)}async function saveVideo(){let f=$('#vf').files[0],title=$('#vt').value.trim()||(f?.name?.replace(/\.[^.]+$/,'')||'Vídeo');if(!f)return toast('Escolha um vídeo');try{let path='videos/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let r=await fetch(URL+'/storage/v1/object/lpa-files/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':f.type||'application/octet-stream','x-upsert':'false'},body:f});if(!r.ok)throw Error(await r.text());await api('lpa_videos',{method:'POST',body:JSON.stringify({title,category_id:$('#vc').value,video_date:$('#vd').value||null,ministry:$('#vm').value,notes:$('#vn').value,storage_path:path,file_name:f.name,file_type:f.type,file_size:f.size}),headers:{Prefer:'return=minimal'}});closeM();toast('Vídeo adicionado');await load()}catch(e){toast('Erro: '+e.message)}}function play(path){window.open(URL+'/storage/v1/object/public/lpa-files/'+encodeURI(path),'_blank')}async function delVideo(id,path){if(!confirm('Excluir este vídeo?'))return;try{if(path)await fetch(URL+'/storage/v1/object/lpa-files',{method:'DELETE',headers:H,body:JSON.stringify({prefixes:[path]})});await api('lpa_videos?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}});await load()}catch(e){toast('Erro ao excluir')}}
function renderCats(){$('#main').innerHTML=header('Categorias','Organize seus vídeos por categorias','<button class="btn primary" onclick="newCat()">＋ Nova categoria</button>')+`<div class="panel">${cats.map(c=>`<div class="row"><div><b>${esc(c.name)}</b><div class="meta">${vids.filter(v=>v.category_id===c.id).length} vídeos</div></div><div><button class="btn" onclick="renameCat('${c.id}','${esc(c.name)}')">Editar</button> ${c.is_default?'':'<button class="btn danger" onclick="delCat(\''+c.id+'\')">Excluir</button>'}</div></div>`).join('')}</div>`}function newCat(){modal(`<h2>Nova categoria</h2><div class="field"><label>Nome</label><input id="cn"></div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveCat()">Criar</button></div>`)}async function saveCat(){let n=$('#cn').value.trim();if(!n)return;let slug=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');await api('lpa_categories',{method:'POST',body:JSON.stringify({name:n,slug,sort_order:cats.length+1}),headers:{Prefer:'return=minimal'}});closeM();await load()}function renameCat(id,name){modal(`<h2>Editar categoria</h2><div class="field"><input id="cn" value="${esc(name)}"></div><div class="actions"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveRename('${id}')">Salvar</button></div>`)}async function saveRename(id){await api('lpa_categories?id=eq.'+id,{method:'PATCH',body:JSON.stringify({name:$('#cn').value.trim(),updated_at:new Date().toISOString()}),headers:{Prefer:'return=minimal'}});closeM();await load()}async function delCat(id){if(vids.some(v=>v.category_id===id))return toast('Mova ou exclua os vídeos dessa categoria primeiro');if(confirm('Excluir categoria?')){await api('lpa_categories?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}});await load()}}
function renderBackup(){$('#main').innerHTML=header('Backup','Proteja seus dados')+`<div class="panel"><h3>Backup local</h3><p class="sub">Baixe uma cópia dos vídeos (metadados), categorias e configurações.</p><button class="btn primary" onclick="backupLocal()">Fazer Backup Agora</button> <label class="btn">Restaurar arquivo<input type="file" accept="application/json" hidden onchange="restoreFile(this.files[0])"></label></div><div class="panel"><h3>Backup na nuvem (Supabase)</h3><p class="sub">Salva uma fotografia dos dados atuais no próprio Supabase.</p><button class="btn primary" onclick="backupCloud()">Salvar backup na nuvem</button></div>`}function payload(){return {version:4,created_at:new Date().toISOString(),categories:cats,videos:vids,settings}}function backupLocal(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}));a.download='livres_para_adorar_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click()}async function backupCloud(){await api('lpa_backups',{method:'POST',body:JSON.stringify({label:'Backup '+new Date().toLocaleString('pt-BR'),payload:payload()}),headers:{Prefer:'return=minimal'}});toast('Backup salvo no Supabase')}async function restoreFile(f){if(!f)return;try{let d=JSON.parse(await f.text());if(!confirm('Restaurar este backup? Os metadados atuais serão substituídos.'))return;await api('lpa_videos?id=not.is.null',{method:'DELETE',headers:{Prefer:'return=minimal'}}).catch(()=>{});if(d.videos?.length)await api('lpa_videos',{method:'POST',body:JSON.stringify(d.videos.map(v=>{let x={...v};delete x.id;delete x.created_at;delete x.updated_at;return x})),headers:{Prefer:'return=minimal'}});toast('Backup restaurado');await load()}catch(e){toast('Backup inválido')}}
function renderSettings(){$('#main').innerHTML=header('Configurações','Personalize o aplicativo')+`<div class="panel form"><div class="field"><label>Tema</label><select onchange="setSetting('theme',this.value)"><option value="dark" ${settings.theme==='dark'?'selected':''}>Escuro</option><option value="light" ${settings.theme==='light'?'selected':''}>Claro</option><option value="system" ${settings.theme==='system'?'selected':''}>Sistema</option></select></div><div class="field"><label>Visualização</label><select onchange="setSetting('view_mode',this.value)"><option value="grid" ${settings.view_mode==='grid'?'selected':''}>Grade</option><option value="list" ${settings.view_mode==='list'?'selected':''}>Lista</option></select></div><div class="field full"><label><input type="checkbox" ${settings.sidebar_collapsed?'checked':''} onchange="setSetting('sidebar_collapsed',this.checked)"> Barra lateral recolhida</label></div></div><div class="panel"><div class="status">● Supabase conectado</div></div>`}async function setSetting(k,v){settings[k]=v;apply();await api('lpa_settings?id=eq.app',{method:'PATCH',body:JSON.stringify({[k]:v,updated_at:new Date().toISOString()}),headers:{Prefer:'return=minimal'}});render()}function toggleSide(){setSetting('sidebar_collapsed',!settings.sidebar_collapsed)}function toggleView(){setSetting('view_mode',settings.view_mode==='grid'?'list':'grid')}
load();
</script></body></html>
